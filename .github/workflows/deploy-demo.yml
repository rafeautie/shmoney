name: Deploy demo

# The web demo embedded on rafe.dev/shmoney, deployed to shmoney-demo.rafe.dev
# with web screenshots shot fresh from the same build, so it always matches the
# latest release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # the demo bundles no native modules, so skip electron-builder's rebuild
      - run: npm ci --ignore-scripts

      # category names carry emoji; the runner has no color emoji font
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji

      - run: npm run build:demo

      # Chrome is preinstalled on the runner; playwright-core drives it
      - run: npm run screenshots -- --out out/demo/screenshots --web

      - name: Deploy to shmoney-demo.rafe.dev
        run: npx wrangler@4 deploy -c wrangler.demo.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # rafe.dev loads its images from here, so a deploy without them is broken
      - name: Check the deploy
        run: |
          for path in / /version.json /screens.json /screenshots/transactions-1280.webp; do
            curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
              --output /dev/null "https://shmoney-demo.rafe.dev$path"
          done
